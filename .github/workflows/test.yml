name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: the tests need the code and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install pytest

      - name: Run test suite (offline - no secrets needed)
        run: pytest tests/ -q

  workflows:
    name: Workflow security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # zizmor checks the workflow files themselves: permissions, unpinned actions,
      # credential persistence and template injection. Offline mode needs no token.
      # The version is pinned so that a new release cannot turn main red.
      - name: Scan the workflow files
        run: pipx run zizmor==1.32.0 --offline --no-progress .github/workflows
