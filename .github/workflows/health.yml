name: Board Health Check

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of each month, 06:00 UTC
  workflow_dispatch:        # run on demand from the Actions tab

# Read-only: the sweep only reads the board list.
permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requests
        run: pip install requests

      - name: Sweep all company boards
        env:
          JOBHUNTER_PROFILE_FILE: scoring_profiles.example.json
        run: python health_check.py
